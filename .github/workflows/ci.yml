name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: node scripts/check-bundle.mjs
      - run: npm run test:perf
      - uses: actions/upload-artifact@v4
        if: matrix.node-version == '22.x'
        with:
          name: perf
          path: tests/perf/out/

  e2e-linux:
    # Real Obsidian desktop (pinned 1.14.4, checksum-verified) under Xvfb. Mocks do not replace this gate.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 libxss1 libxtst6 || sudo apt-get install -y xvfb libnss3 libgbm1 libasound2 libgtk-3-0 libxss1 libxtst6
      - run: npm ci
      - run: npm run release
      - run: ./scripts/fetch-e2e-deps.sh
      - run: CA_E2E_FROM_RELEASE=1 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: |
            tests/e2e/out/results.json
            tests/e2e/out/results.md
            tests/e2e/out/screenshots/
